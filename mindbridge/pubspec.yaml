name: mindbridge
description: A collaborative study platform for students
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_storage: ^11.5.6
  google_sign_in: ^6.1.6

  # State Management
  provider: ^6.1.1

  # File Handling
  file_picker: ^10.3.3
  image_picker: ^1.0.5

  # UI Components
  cached_network_image: ^3.3.0

  # Utilities
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.2
  share_plus: ^7.2.2
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true